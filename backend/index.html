<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI MONSTER U</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050607;
      color: white;
      font-family: Arial, sans-serif;
    }

    nav {
      height: 70px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .logo span {
      color: #00ffa6;
    }

    nav a {
      color: #00120c;
      background: #00ffa6;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
    }

    main {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hero {
      max-width: 800px;
    }

    .badge {
      color: #00ffa6;
      font-size: 11px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(42px,8vw,75px);
      margin-bottom: 20px;
    }

    h1 span {
      color: #00ffa6;
    }

    p {
      color: #858585;
      line-height: 1.7;
      max-width: 620px;
      margin: auto;
    }

    .buttons {
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 25px;
      margin: 5px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
    }

    .primary {
      background: #00ffa6;
      color: #00120c;
    }

    .secondary {
      border: 1px solid #333;
      color: white;
    }
  </style>
</head>

<body>

<nav>
  <div class="logo">
    AI <span>MONSTER U</span>
  </div>

  <a href="auth.html">
    LOGIN
  </a>
</nav>

<main>

  <div class="hero">

    <div class="badge">
      ● AI TRADING PLATFORM
    </div>

    <h1>
      AI <span>MONSTER U</span>
    </h1>

    <p>
      A modern trading platform for automated strategies,
      market analysis, account management and risk control.
    </p>

    <div class="buttons">

      <a
        class="button primary"
        href="auth.html">
        GET STARTED
      </a>

      <a
        class="button secondary"
        href="auth.html">
        LOGIN
      </a>

    </div>

  </div>

</main>

</body>
</html>
